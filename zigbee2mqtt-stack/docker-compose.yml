services:
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    network_mode: host
    volumes:
      - /home/rocket/projects/home.rocket/zigbee2mqtt-stack/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
